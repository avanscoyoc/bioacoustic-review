# Sampling design for notebooks/03_frog_sampling.ipynb, set by the project lead.
# Collaborators: don't edit this file. Your settings go in step 1 of the notebook.
# Every collaborator uses the same values, so all datasets can be merged.
# segment_seconds, min_gap_seconds and seed are locked after the first round:
# the notebook stops if they change.

segments_per_site: 25       # clips per site in each round, spread over as many recordings as possible
segment_seconds: 10
min_gap_seconds: 60         # at least this much audio between two clips from the same recording
max_segments_per_site: 75   # stop adding rounds at a site after this many clips
seed: 0
