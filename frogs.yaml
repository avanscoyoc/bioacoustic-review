# Sampling settings for notebooks/03_frog_sampling.ipynb.
# Fill in the first block before your first run. After the first round, source, path_pattern,
# recording_time, night_starts_at, segments_per_night, segment_seconds, min_gap_seconds
# and seed are locked: the notebook stops if they change.

# ── About your data ──────────────────────────────────────────────
source: my-frogs            # short name for your dataset: lowercase letters, digits, hyphens
contributor: Your Name
audio_dir: local_data/audio # folder with your recordings (use / even on Windows)

# Where the site name sits in each file's path, relative to audio_dir (no extension).
#   {site}   the site name (required)
#   {_}      any text you want to skip
#   {name}   any other part to keep as a column, e.g. {deployment} or {recorder}
# Examples:
#   POND3/20260412_213000.wav            ->  "{site}/{_}"
#   2026-spring/POND3/SD01/file.wav      ->  "{deployment}/{site}/{recorder}/{_}"
#   POND3_20260412_213000.wav (no folders) -> "{site}_{_}"   (site must not contain _)
path_pattern: "{site}/{_}"

recording_time:
  format: "%Y%m%d_%H%M%S"   # how the date and time appear in file names; null if they don't
  file_timezone: UTC        # time zone the recorder wrote (AudioMoth: usually UTC); "local" if local
  local_timezone: America/Los_Angeles
night_starts_at: 12         # recordings that start before this hour belong to the previous night

# ── Sampling (leave as is unless the project lead says otherwise) ─
pick_nights: auto           # auto, or manual to tick nights yourself
nights_per_site: 5
segments_per_night: 5
segment_seconds: 10
min_gap_seconds: 60
max_segments_per_site: 75   # stop adding rounds at a site after this many segments
seed: 0

# Optional: only for a "focused" round, after random rounds found no frogs.
# Focused segments are used for training but not for testing.
focus:
  hours: null               # e.g. [19, 20, 21, 22, 23] = 7 pm to midnight, local time
  months: null              # e.g. [3, 4, 5]
