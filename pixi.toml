[workspace]
authors = ["avanscoyoc <amy.e.van.scoyoc@gmail.com>"]
channels = ["conda-forge"]
name = "non-avian-validation"
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]
version = "0.1.0"

[dependencies]
python = "3.12.*"
jupyterlab = ">=4.6.4,<5"
ipykernel = ">=7.4.0,<8"
# audio (ffmpeg enables fast partial/byte-range reads in jupyter-bioacoustic & ondio)
ffmpeg = "*"
pytest = "*"
python-dotenv = "*"

[pypi-dependencies]
jupyter-bioacoustic = "*"
ondio = "*"

[tasks]
# --allow-root: the dev container runs as root (remoteUser in devcontainer.json)
jupyter = "jupyter lab --ip=0.0.0.0 --no-browser --allow-root"
test = "pytest -q tests"
