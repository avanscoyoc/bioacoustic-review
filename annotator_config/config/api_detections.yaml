description:
  title: Instructions
  text: "Listen to the clip and look at the spectrogram, then answer whether the detected\
    \ species is correct.\n\n- **Yes**: rate your confidence and add notes if needed.\n\
    - **No**: choose a reason, the species you hear (if you know it), and the signal\
    \ quality. Flag the clip if an expert should check it.\n\nClick **Submit** to save\
    \ your answer, or **Skip** to move on without answering. **Capture** saves an image\
    \ of the spectrogram to `output/spectrograms/`.\n"
  open: false
display_columns:
- site
- recording_id
- common_name
- confidence
info_card_title: '[[common_name]]'
info_card_text: '[[scientific_name]]'
capture: true
capture_dir: output/spectrograms
default_buffer: 0.5
form_config: annotator_config/forms/api_detections.yaml
