title:
  value: Review detection
  progress_tracker: true
pass_value:
  source_column: id
  column: detection_id
form:
- select:
    label: Is [[common_name]] correct?
    column: is_valid
    required: true
    items:
    - label: 'Yes'
      value: 'yes'
      form: confirmed_form
    - label: 'No'
      value: 'no'
      form: rejected_form
dynamic_forms:
  confirmed_form:
  - select:
      label: Your confidence
      column: reviewer_confidence
      items:
      - low
      - medium
      - high
  - textbox:
      label: Notes
      column: notes
  rejected_form:
  - select:
      label: Reason
      column: rejection_reason
      required: true
      items:
      - noise
      - wrong species
      - overlapping signals
      - too faint
      - other
  - select:
      label: Species you hear
      column: corrected_common_name
      items:
        path: species.csv
        value: common_name
        filter_box: true
        custom_value: true
        not_available:
          label: Unknown species
          value: unknown
  - number:
      label: Signal quality (1-5)
      column: signal_quality
      min: 1
      max: 5
      step: 1
  - checkbox:
      label: Flag for expert review
      column: flagged
  - textbox:
      label: Notes
      column: notes
      multiline: true
submission_buttons:
  line: true
  next:
    label: Skip
  submit:
    label: Submit
