title:
  value: Label frog calls
  progress_tracker: true

form:
- annotation:
    start_time:
      label: window start
      column: window_start
    end_time:
      label: window end
      column: window_end
    tools:
    - fixed_duration:
        window: 3
- select:
    label: Any frog call in the window?
    column: frog_in_window
    required: true
    items:
    - label: 'Yes'
      value: 'yes'
      form: yes_form
    - label: 'No'
      value: 'no'
    - label: Unsure
      value: unsure
      form: unsure_form
    - label: Recording unusable
      value: unusable
- text: Tick every non-frog sound you hear anywhere in the 10 seconds. Leave all blank if it is quiet.
- checkbox:
    label: 1) Insects
    column: insects
- checkbox:
    label: 2) Birds or mammals
    column: birds_mammals
- checkbox:
    label: 3) Rain
    column: rain
- checkbox:
    label: 4) Wind
    column: wind
- checkbox:
    label: 5) Flowing water
    column: water
- checkbox:
    label: 6) Voices, traffic or machinery
    column: human
- checkbox:
    label: 7) Handling or microphone noise
    column: handling
- textbox:
    label: Notes
    column: notes
    multiline: true

dynamic_forms:
  yes_form:
  - select:
      label: Species 1
      column: species_1
      required: true
      items:
        path: species.csv
        value: common_name
        filter_box: true
        not_available:
          label: Unknown frog
          value: unknown_frog
  - select:
      label: Species 1 call is
      column: clarity
      required: true
      items: [clear, faint]
  - select:
      label: Species 2 (optional)
      column: species_2
      items:
        path: species.csv
        value: common_name
        filter_box: true
        not_available:
          label: Unknown frog
          value: unknown_frog
  - select:
      label: Species 2 call is
      column: clarity_2
      required: false
      items: [clear, faint]
  - select:
      label: Species 3 (optional)
      column: species_3
      items:
        path: species.csv
        value: common_name
        filter_box: true
        not_available:
          label: Unknown frog
          value: unknown_frog
  - select:
      label: Species 3 call is
      column: clarity_3
      required: false
      items: [clear, faint]

  unsure_form:
  - select:
      label: Why unsure?
      column: unsure_reason
      required: true
      items:
      - too faint
      - call cut off at the clip edge
      - might not be a frog
      - masked by noise
      - other (explain in notes)

submission_buttons:
  line: true
  previous: true
  submit:
    label: Submit
